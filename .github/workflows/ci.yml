name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: swift --version
      - name: Test Swift package
        run: swift test
      - name: Build runnable example
        run: swift build --package-path Examples/Decisions
      - name: Test evaluation harness
        run: python3 -m unittest discover -s scripts -p 'test_evaluate.py'
